name: Publicar Controle de Estoque

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # ==========================================
  # PREPARA O SITE
  # ==========================================

  build:

    runs-on: ubuntu-latest

    steps:

      # Baixa os arquivos do repositório
      - name: Baixar repositório
        uses: actions/checkout@v6


      # Configura o GitHub Pages
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5


      # Copia somente o projeto Controle de Estoque
      - name: Preparar site
        run: |
          mkdir _site

          cp -r "02-Projetos/Controle de Estoque/." "_site/"


      # Envia os arquivos para o GitHub Pages
      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"


  # ==========================================
  # PUBLICA O SITE
  # ==========================================

  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4