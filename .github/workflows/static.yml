# Publica somente o projeto Controle de Estoque

name: Publicar Controle de Estoque

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar Controle de Estoque
        run: |
          mkdir _site
          cp -r "02-Projetos/Controle de Estoque/." "_site/"

      - name: Enviar arquivos para o Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
